<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>hashOpener</title>
  
  <style>
    body {
      font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
      background: transparent;
      padding: 0rem;
      margin: 0;
    }
    .card {
      background: rgba(255,255,255,0.85);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      max-width: 800px;
      margin: auto;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: .5rem;
      font-size: 1.1rem;
    }
    input {
      width: 100%;
      padding: .75rem;
      font-size: 1.1rem;
      border: 1px solid #bbb;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 1rem;
      font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    }
    button {
	  font-family: "Comic Sans MS", "Comic Sans", cursive !important;
	  margin-top: 1rem;
	  padding: .75rem 1.25rem;
	  font-size: 1.1rem;
	  border-radius: 8px;
	  border: none;
	  background: #e69138;
	  color: white;
	  cursor: pointer;
	  transition: background 0.2s ease;
	}
	.center-box {
	  display: flex;
	  justify-content: center;   /* centers horizontally */
	  align-items: center;       /* centers vertically (if you want that too) */
	  height: 100vh;             /* optional: makes it vertically centered on screen */
	}
	
    button:hover {
      background: #b45f06;
    }
  </style>
</head>
<body>
	<div class="center-box">
		<button id="presetBtn">Click me to open this url in about:blank</button>
	</div>
  

  <script>
    function ensureScheme(url) {
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url)) return url;
      if (/^\/\//.test(url)) return url;
      return 'https://' + url;
    }

	const preset = document.getElementById('presetBtn');
	
	preset.addEventListener('click', () => {
	
		const url = window.location.hash.slice(1);
		
		if (url) {
        
		 // open new about:blank window
		  var win = window.open();
		  if (!win) {
			alert("y did u block popups lil vro");
			return;
		  }

		  // inject iframe into new window
		  var iframe = win.document.createElement('iframe');
		  iframe.style.width = "100%";
		  iframe.style.height = "100%";
		  iframe.style.border = "none";
		  iframe.src = url;
		  win.document.body.style.margin = "0";
		  win.document.body.appendChild(iframe);
		
		} else {
		alert("HASH WINDOW IS NOT A URL")
		}
		
	});
  </script>
</body>
</html>

><tspan x="0" dy="46.150000000000006px">4. You can now copy a chatrooms ID via the sidebar</tspan><tspan x="0" dy="46.150000000000006px">5. Stopped text from overflowing</tspan><tspan x="0" dy="46.150000000000006px">6. Your username and profile picture are saved when you come</tspan><tspan x="0" dy="46.150000000000006px">back!</tspan></text></g></g></svg>
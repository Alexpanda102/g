<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="419" height="292.24444" viewBox="0,0,419,292.24444"><g transform="translate(-110.5,-33.87778)"><g stroke-miterlimit="10"><path d="M118.11111,323.62222c-2.8228,0 -5.11111,-2.28833 -5.11111,-5.11111v-277.02222c0,-2.8228 2.28832,-5.11111 5.11111,-5.11111h403.77778c2.8228,0 5.11111,2.28832 5.11111,5.11111v277.02222c0,2.82278 -2.28832,5.11111 -5.11111,5.11111z" fill="#323339" stroke="#1a1a1d" stroke-width="5"/><text transform="translate(225.72288,79.11573) scale(0.78355,0.78355)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="#ffffff" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Update Logs</tspan></text><text transform="translate(265.51489,103.48914) scale(0.25422,0.25422)" font-size="40" xml:space="preserve" fill="#edf0ff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Last updated 2/26/2026</tspan></text><text transform="translate(125.75,310.21724) scale(0.26449,0.26449)" font-size="40" xml:space="preserve" fill="#acaeb9" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Click anywhere to close this prompt.</tspan></text><text transform="translate(129.48854,128.66313) scale(0.30778,0.30778)" font-size="40" xml:space="preserve" fill="#edf0ff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Concluding update before the next big feature update</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">1. Fixed notifications stacking </tspan><tspan x="0" dy="46.150000000000006px">2. MORE optimizations</tspan><tspan x="0" dy="46.150000000000006px">3. Fixed weird scrolling bug when there are less than 5 messages</tspan><tspan x="0" dy="46.150000000000006px">4. Internal organization that no one cares about but is super</tspan><tspan x="0" dy="46.150000000000006px">important for future updates</tspan><tspan x="0" dy="46.150000000000006px">5. YYF (Yeet Your Files) button! Upload files from here!</tspan><tspan x="0" dy="46.150000000000006px">6. YYF links are supported and can be opened by clicking a</tspan><tspan x="0" dy="46.150000000000006px">message that has a link.</tspan><tspan x="0" dy="46.150000000000006px">7. Fixed text overlapping this window</tspan></text></g></g></svg>
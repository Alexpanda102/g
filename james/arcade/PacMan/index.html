<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pac-Man (MAME) - Fullscreen</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      font-size: 24px;
      z-index: 10;
    }

    #game {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Pac-Man… please wait ⏳</div>
  <div id="game"></div>

  <!-- EmulatorJS Loader -->
  <script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@latest/emulator.min.js"></script>

  <script>
    EJS_player = '#game';
    EJS_gameName = 'Pac-Man (MAME)';
    EJS_biosUrl = '';
    EJS_gameUrl = 'pacman.zip'; // expects pacman.zip in same folder
    EJS_core = 'mame2003';

    // Hide loading screen once emulator is ready
    const observer = new MutationObserver(() => {
      const canvas = document.querySelector('#game canvas');
      if (canvas && canvas.style.display !== 'none') {
        document.getElementById('loading').style.display = 'none';
        observer.disconnect();
      }
    });
    observer.observe(document.querySelector('#game'), { childList: true, subtree: true });
  </script>
</body>
</html>
